[build]
  publish = "dist/public"
  command = "echo 'Static site - no build needed'"
  functions = "netlify/functions"

# RSS Proxy endpoint
[[redirects]]
  from = "/api/rss"
  to = "/.netlify/functions/rss-proxy"
  status = 200

# GHL Subscribe endpoint
[[redirects]]
  from = "/api/ghl-subscribe"
  to = "/.netlify/functions/ghl-subscribe"
  status = 200

# Don't redirect actual files (images, css, js, etc)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { NOT = {path = ["/*.jpg", "/*.jpeg", "/*.png", "/*.gif", "/*.webp", "/*.svg", "/*.css", "/*.js", "/*.json"]} }
